name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: build + verify (Linux, gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3

      - name: configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAIRPLAY_BUILD_TESTS=ON -DAIRPLAY_BUILD_EXAMPLE=ON

      # targeted build: a bare --build would also compile Mbed TLS's TLS/X509
      # libs (unused here) whose -Werror build breaks on some newer compilers.
      - name: build
        run: cmake --build build --target raop_sender airplay_send m1_verify transport_loopback --parallel

      - name: verify
        run: ctest --test-dir build --output-on-failure

  windows:
    name: build + verify (Windows, mingw)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAIRPLAY_BUILD_TESTS=ON -DAIRPLAY_BUILD_EXAMPLE=ON

      # builds the Winsock poll transport + the example + the cross-platform
      # loopback test (m1_verify is POSIX-only, so it is not built here).
      - name: build
        run: cmake --build build --target raop_sender airplay_send transport_loopback --parallel

      - name: verify
        run: ctest --test-dir build --output-on-failure
