name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    name: build + verify the Qt-free sender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3

      - name: configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAIRPLAY_BUILD_TESTS=ON

      # build the test harness target, which pulls in raop_sender + the poll
      # transport + airplay_crypto + mbedcrypto + ed25519. targeted on purpose:
      # a bare `--build` would also compile Mbed TLS's TLS/X509 libs (unused
      # here) whose -Werror build breaks on some newer compilers.
      - name: build
        run: cmake --build build --target m1_verify --parallel

      # loopback AirPlay-1 handshake through the poll transport, plus the
      # timer / creds / UDP-source-reply unit checks.
      - name: verify
        run: ctest --test-dir build --output-on-failure
